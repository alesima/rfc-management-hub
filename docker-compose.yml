services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: rfc_management:latest
        container_name: rfc_management
        # Host networking: this machine's kernel lacks the iptables NAT
        # modules Docker needs to publish ports (DNAT fails), so the
        # container shares the host stack and binds 8000/5173 directly.
        network_mode: host
        volumes:
            - .:/var/www
            - ./node_modules:/var/www/node_modules
        env_file:
            - .env
        depends_on: []
        command: |
            sh -c "touch /var/www/database/database.sqlite && php artisan migrate && /usr/bin/supervisord -c /etc/supervisord.conf"
